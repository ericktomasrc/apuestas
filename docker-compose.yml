services:
  db:
    image: postgres:16
    container_name: apuestas_db
    environment:
      POSTGRES_PASSWORD: local123
      POSTGRES_DB: apuestas
    ports:
      - "5432:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apuestas"]
      interval: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: apuestas_redis
    ports:
      - "6379:6379"

volumes:
  datos:
