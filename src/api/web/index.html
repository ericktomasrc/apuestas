<!-- Los estilos viven en archivos aparte, no dentro de este HTML.
     Son casi seiscientas líneas: mezcladas con la estructura obligaban
     a bajar por todas ellas para llegar al <body>, y cualquier cambio
     de color tocaba el mismo archivo que la maqueta.

     El orden importa: `estilos.css` define las variables y la base;
     `estilos-muro.css` se apoya en ellas. Al revés, las clases del
     muro no encontrarían --favor ni --linea. -->
<link rel="stylesheet" href="estilos.css">
<link rel="stylesheet" href="estilos-muro.css">
</head>
